name: Rust CLI compatibility

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'tests/**'
      - 'harness/**'
      - 'main.go'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/rust-phase1.yaml'
  workflow_dispatch:
    inputs:
      include_full60s:
        description: Also run the opt-in real 60-second SQL and administration deadline tiers
        type: boolean
        default: false
      include_full120s:
        description: Also run the opt-in real 120-second metrics deadline tier
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Freeze the behavioral oracle, including its Unicode diagnostic tables.
          go-version: '1.25.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - name: Build Go reference, Rust candidate and measurement tools
        run: make -f harness/Makefile phase5-build CARGO='cargo +1.96.0'
      - name: Check Rust and harness
        env:
          PB_GO_ORACLE: ${{ github.workspace }}/bin/pb-go
          PB_PHASE3_FIXTURE: ${{ github.workspace }}/bin/pb-fixture
        run: |
          make -f harness/Makefile rust-test CARGO='cargo +1.96.0'
          python3 -m unittest discover -s harness -p 'test_*.py' -v
      - name: Compare phase-one behavior
        run: make -f harness/Makefile phase1-check OUT=harness/results/phase1-ci
      - name: Record startup measurements
        run: make -f harness/Makefile phase1-measure OUT=harness/results/phase1-ci REPETITIONS=5
      - name: Compare phase-two behavior and configuration interoperability
        run: make -f harness/Makefile phase2-check OUT=harness/results/phase2-ci
      - name: Record online command measurements
        run: |
          make -f harness/Makefile phase2-measure OUT=harness/results/phase2-ci REPETITIONS=5
          make -f harness/Makefile phase2-workloads-measure OUT=harness/results/phase2-ci REPETITIONS=5
      - name: Compare phase-three SQL fixtures and deferred boundaries
        # The default gate excludes known-divergence and full60s tiers.
        run: make -f harness/Makefile phase3-check OUT=harness/results/phase3-ci
      - name: Record SQL measurements
        # Hosted-CI samples are harness evidence, not a performance release gate.
        run: make -f harness/Makefile phase3-measure OUT=harness/results/phase3-ci REPETITIONS=5
      - name: Compare phase-four metrics and saved SQL
        run: make -f harness/Makefile phase4-check OUT=harness/results/phase4-ci
      - name: Compare phase-five administration and isolated state transitions
        run: make -f harness/Makefile phase5-check OUT=harness/results/phase5-ci
      - name: Compare real SQL deadline cases
        if: github.event_name == 'workflow_dispatch' && inputs.include_full60s
        run: make -f harness/Makefile phase3-deadline-check OUT=harness/results/phase3-deadline-ci
      - name: Compare real metrics deadline cases
        if: github.event_name == 'workflow_dispatch' && inputs.include_full120s
        run: make -f harness/Makefile phase4-deadline-check OUT=harness/results/phase4-deadline-ci
      - name: Compare real administration deadline cases
        if: github.event_name == 'workflow_dispatch' && inputs.include_full60s
        run: make -f harness/Makefile phase5-deadline-check OUT=harness/results/phase5-deadline-ci
      - name: Retain compatibility and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb-rust-compatibility-${{ github.sha }}
          path: |
            harness/results/phase1-ci/
            harness/results/phase2-ci/
            harness/results/phase3-ci/
            harness/results/phase3-deadline-ci/
            harness/results/phase4-ci/
            harness/results/phase4-deadline-ci/
            harness/results/phase5-ci/
            harness/results/phase5-deadline-ci/
          retention-days: 14
